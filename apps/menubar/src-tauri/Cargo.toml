[package]
name = "mxbar"
version = "0.1.0"
description = "mx menubar app — lists your active mx works"
authors = ["Rousan Ali"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"

[profile.release]
opt-level = "s"
lto = true
strip = true
