name: Deploy site

# Publishes the whole public site to GitHub Pages as ONE artifact:
#   /       -> the landing app        (apps/landing)
#   /deck   -> the demo deck          (apps/landing/public/deck)
#   /docs   -> the user docs (VitePress, apps/docs), built into dist/docs
# Triggers:
#   - push to main   -> build + deploy the live site (mx.rousanali.com)
#   - pull_request   -> build only (a check that the site still compiles)
# The custom domain is carried by apps/landing/public/CNAME, which Vite copies
# into dist/ so the Pages artifact always declares mx.rousanali.com.
# Only runs when the site or its build inputs actually change.

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'apps/docs/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    paths:
      - 'apps/landing/**'
      - 'apps/docs/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

# GitHub Pages deployment needs these; id-token lets deploy-pages authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight Pages deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # Produces the static landing site (incl. the CNAME and /deck) at
      # apps/landing/dist.
      - run: pnpm landing:build

      # Build the VitePress user docs (base: /docs/) and fold them into the
      # landing dist under /docs, so the whole site ships as one Pages artifact.
      - run: pnpm docs:build
      - run: |
          mkdir -p apps/landing/dist/docs
          cp -R apps/docs/.vitepress/dist/. apps/landing/dist/docs/

      # Package dist/ as the Pages artifact for the deploy job to consume.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

  deploy:
    # Only publish from main; on PRs the build job above is just a check.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
