name: Deploy landing

# Publishes the landing + docs site (apps/landing) as a Cloudflare Worker
# (assets-only, via wrangler) — NOT Cloudflare Pages.
#   - push to main   -> `wrangler deploy`         (PRODUCTION; serves mx.rousanali.com)
#   - pull_request   -> `wrangler versions upload` (a preview version with its own URL)
# Only runs when the site or its build inputs actually change.

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'

# One deploy per ref at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

# The deploy authenticates to Cloudflare with an API token, not the GitHub
# token, so read access to the repo is all this job needs.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # Produces the static site at apps/landing/dist.
      - run: pnpm landing:build

      # Deploy the assets-only Worker. On a PR we upload a preview VERSION
      # (does not touch production); on push to main we deploy to production.
      # wrangler reads apps/landing/wrangler.jsonc (name: mx-landing).
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}

      # Surface the deployment URL in the run summary (no PR comment, by design).
      - name: Report deployment URL
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
