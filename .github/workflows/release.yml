name: Release

# Publishes mx-multiplexer to npm when a v* tag is pushed.
# Requires an NPM_TOKEN (npm automation token) in the repository secrets.
#
# The publishable package lives in /npm and is populated by `pnpm build`
# (tsup -> npm/bin/mx.js, plus templates and LICENSE copied in).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --access public
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
