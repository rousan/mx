name: Build menubar app

# Builds the mxbar desktop menubar app (apps/menubar, Tauri) for macOS, Windows,
# and Linux, and attaches the installers to a GitHub Release.
#
# The CLI's release workflow (release.yml) creates the vX.Y.Z GitHub Release on
# merge to main; when that release is published, this workflow fires and uploads
# the desktop bundles as assets on the same release. It can also be run manually
# (workflow_dispatch), in which case it just builds (no upload).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build that runs on both Apple Silicon and Intel.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/menubar/src-tauri -> target'

      - run: pnpm install

      # Builds the Tauri bundles and, when triggered by a published release,
      # uploads them as assets on that release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/menubar
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ github.event.release.id }}
